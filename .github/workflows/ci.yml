name: FarmaGest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/farmagest-web/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: frontend/farmagest-web

      - name: Ejecutar pruebas unitarias
        run: npm run test:barcode
        working-directory: frontend/farmagest-web

      - name: Compilar Frontend Angular (Producción)
        run: npm run build
        working-directory: frontend/farmagest-web

      - name: Validar sintaxis del servidor Mock Gateway
        run: node -c backend/mock-server.js
