<div class="login-wrapper">
  <div class="login-container">
    
    <!-- Tarjeta Principal de Login -->
    <div class="tarjeta login-card">
      
      <!-- Enlace para volver a la página web principal -->
      <div style="margin-bottom: 1.25rem;">
        <a routerLink="/" style="display: inline-flex; align-items: center; gap: 6px; color: #0F766E; font-size: 0.85rem; font-weight: 700; text-decoration: none; padding: 4px 8px; border-radius: 6px; background-color: #E6F4F1;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          ← Volver a farmagest.tech
        </a>
      </div>

      <!-- Encabezado con Identidad de Marca -->
      <div class="brand-header">
        <div class="brand-logo-badge">
          <svg width="56" height="56" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="fgLogoBgLogin" x1="0" y1="0" x2="38" y2="38" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#042F2C"/>
                <stop offset="60%" stop-color="#0B3D38"/>
                <stop offset="100%" stop-color="#0D9488"/>
              </linearGradient>
              <linearGradient id="fgLeafGradLogin" x1="19" y1="8" x2="30" y2="19" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#34D399"/>
                <stop offset="100%" stop-color="#10B981"/>
              </linearGradient>
            </defs>
            <rect width="38" height="38" rx="10" fill="url(#fgLogoBgLogin)"/>
            <rect x="0.75" y="0.75" width="36.5" height="36.5" rx="9.25" stroke="white" stroke-opacity="0.25" stroke-width="1.5"/>
            <rect x="16.5" y="8" width="5" height="22" rx="2.5" fill="#FFFFFF"/>
            <rect x="8" y="16.5" width="22" height="5" rx="2.5" fill="#34D399"/>
            <path d="M21.5 9.5C27 9.5 28.5 11 28.5 16.5C24.5 16.5 21.5 14 21.5 9.5Z" fill="url(#fgLeafGradLogin)"/>
            <circle cx="19" cy="19" r="1.75" fill="#042F2C"/>
          </svg>
        </div>
        <h1 class="brand-title">Farma<span class="brand-accent">Gest</span><span class="brand-dot">.</span></h1>
        <p class="brand-subtitle">Plataforma SaaS de gestión farmacéutica · Ate, Lima</p>
      </div>

      <!-- Alerta de Error -->
      <div *ngIf="errorMensaje()" class="alerta-error" role="alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ errorMensaje() }}</span>
      </div>

      <!-- Formulario de Acceso -->
      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="username" class="label-campo">Usuario</label>
          <div class="input-with-icon">
            <input 
              id="username"
              name="username"
              type="text" 
              class="campo-control" 
              placeholder="Ingresa tu usuario"
              [(ngModel)]="username"
              required
              autocomplete="username"
            />
            <span class="icon-suffix">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="label-campo">Contraseña</label>
          <div class="input-with-icon">
            <input 
              id="password"
              name="password"
              type="password" 
              class="campo-control" 
              placeholder="Ingresa tu contraseña"
              [(ngModel)]="password"
              required
              autocomplete="current-password"
            />
            <span class="icon-suffix">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
          </div>
        </div>

        <button 
          type="submit" 
          class="btn btn-primario btn-block" 
          [disabled]="cargando()"
        >
          <span *ngIf="!cargando()">Iniciar Sesión</span>
          <span *ngIf="cargando()">Verificando...</span>
        </button>
      </form>

    </div>

    <!-- Pie de Seguridad -->
    <div class="login-footer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>Conexión cifrada con JWT & Spring Security · FarmaGest v1.0</span>
    </div>

  </div>
</div>
