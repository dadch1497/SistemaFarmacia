name: farmagest

services:
  mysql:
    image: mysql:8.0
    container_name: farmagest-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-farmagest_root_secure_pwd}
      MYSQL_USER: ${MYSQL_USER:-farmagest_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-farmagest_pwd_123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - farmagest-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: farmagest-phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8090}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-farmagest_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-farmagest_pwd_123}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - farmagest-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: farmagest-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-farmagest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-farmagest_rabbit_123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - farmagest-net

  eureka-server:
    build:
      context: ../backend/eureka-server
      dockerfile: Dockerfile
    image: farmagest-eureka-server:latest
    container_name: farmagest-eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmagest-net

  api-gateway:
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    image: farmagest-api-gateway:latest
    container_name: farmagest-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmagest-net

  ms-auth:
    build:
      context: ../backend/ms-auth
      dockerfile: Dockerfile
    image: farmagest-ms-auth:latest
    container_name: farmagest-ms-auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-farmagest_user}
      DB_PASS: ${MYSQL_PASSWORD:-farmagest_pwd_123}
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminSecure2026!}
      INITIAL_VENDEDOR1_PASSWORD: ${INITIAL_VENDEDOR1_PASSWORD:-Vendedor1Secure2026!}
      INITIAL_VENDEDOR2_PASSWORD: ${INITIAL_VENDEDOR2_PASSWORD:-Vendedor2Secure2026!}
      INITIAL_ALMACENERO_PASSWORD: ${INITIAL_ALMACENERO_PASSWORD:-AlmaceneroSecure2026!}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmagest-net

  ms-catalogo:
    build:
      context: ../backend/ms-catalogo
      dockerfile: Dockerfile
    image: farmagest-ms-catalogo:latest
    container_name: farmagest-ms-catalogo
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-farmagest_user}
      DB_PASS: ${MYSQL_PASSWORD:-farmagest_pwd_123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-farmagest}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-farmagest_rabbit_123}
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmagest-net

  ms-inventario:
    build:
      context: ../backend/ms-inventario
      dockerfile: Dockerfile
    image: farmagest-ms-inventario:latest
    container_name: farmagest-ms-inventario
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-farmagest_user}
      DB_PASS: ${MYSQL_PASSWORD:-farmagest_pwd_123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-farmagest}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-farmagest_rabbit_123}
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmagest-net

  ms-compras:
    build:
      context: ../backend/ms-compras
      dockerfile: Dockerfile
    image: farmagest-ms-compras:latest
    container_name: farmagest-ms-compras
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-farmagest_user}
      DB_PASS: ${MYSQL_PASSWORD:-farmagest_pwd_123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-farmagest}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-farmagest_rabbit_123}
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmagest-net

  ms-ventas:
    build:
      context: ../backend/ms-ventas
      dockerfile: Dockerfile
    image: farmagest-ms-ventas:latest
    container_name: farmagest-ms-ventas
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-farmagest_user}
      DB_PASS: ${MYSQL_PASSWORD:-farmagest_pwd_123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-farmagest}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-farmagest_rabbit_123}
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SUNAT_PHP_URL: http://ms-sunat-php:80
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmagest-net

  ms-reportes:
    build:
      context: ../backend/ms-reportes
      dockerfile: Dockerfile
    image: farmagest-ms-reportes:latest
    container_name: farmagest-ms-reportes
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-farmagest_user}
      DB_PASS: ${MYSQL_PASSWORD:-farmagest_pwd_123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-farmagest}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-farmagest_rabbit_123}
      EUREKA_URI: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8086/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - farmagest-net

  ms-sunat-php:
    build:
      context: ../backend/ms-sunat-php
      dockerfile: Dockerfile
    image: farmagest-ms-sunat-php:latest
    container_name: farmagest-ms-sunat-php
    restart: unless-stopped
    ports:
      - "8087:80"
    environment:
      SUNAT_RUC: ${SUNAT_RUC:-20000000001}
      SUNAT_USUARIO_SOL: ${SUNAT_USUARIO_SOL:-MODDATOS}
      SUNAT_CLAVE_SOL: ${SUNAT_CLAVE_SOL:-moddatos}
      SUNAT_ENV: ${SUNAT_ENV:-BETA}
      EMPRESA_RAZON_SOCIAL: ${EMPRESA_RAZON_SOCIAL:-FARMACIA FARMAGEST S.A.C.}
      EMPRESA_NOMBRE_COMERCIAL: ${EMPRESA_NOMBRE_COMERCIAL:-FARMAGEST}
    networks:
      - farmagest-net

  frontend:
    build:
      context: ../frontend/farmagest-web
      dockerfile: Dockerfile
    image: farmagest-frontend:latest
    container_name: farmagest-frontend
    restart: unless-stopped
    ports:
      - "4250:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - farmagest-net

networks:
  farmagest-net:
    driver: bridge

volumes:
  mysql_data:
  rabbitmq_data:
